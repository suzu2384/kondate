<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#436e57"><meta name="description" content="Googleカレンダーとつながる、毎日の献立と調理の記録。AIなしでも献立を作成できます。"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="献立ノート"><title>献立ノート</title><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app">
<header class="app-header"><a class="brand" href="./"><img src="./icons/icon.svg" alt="" width="34" height="34"><span>献立ノート<small>KONDATE NOTE</small></span></a><div class="header-right"><button id="connection" class="connection" title="Googleにログインする" aria-label="Googleにログインする"><span class="dot"></span><span id="connection-label">未接続</span><span id="connection-action" class="connection-action">ログイン</span></button><button id="sync" class="icon-button" aria-label="カレンダーを同期">↻</button></div></header>
<main id="main"></main>
<div id="quick-preset-bar" class="quick-preset-bar" aria-label="予定のクイック登録プリセット" role="toolbar" hidden></div>
<div id="status-bar" class="status-bar" aria-label="共通ステータスバー"><button type="button" id="preset-pending" class="preset-pending" data-action="flush-presets" title="未同期の予定を保存" hidden></button><button type="button" id="notice" class="status-message" data-action="notice-detail" role="status" aria-live="polite" title="通知を表示" hidden></button></div>
<nav class="tabs" aria-label="メインナビゲーション"><button data-tab="calendar" aria-current="page"><span>▦</span>カレンダー</button><button data-tab="generate"><span>✧</span>献立生成</button><button data-tab="photo"><span>▣</span>実績登録</button><button data-tab="settings"><span>⚙</span>設定</button></nav>
</div>
<dialog id="dialog"><div id="dialog-content"></div></dialog>
<script type="module" src="./src/app.js"></script>
</body></html>
