name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
env:
  GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  release:
    name: Publish versioned release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build release archive
        run: |
          npm run build
          cd dist
          zip -r ../kondate-web.zip .
      - name: Create release when version is new
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid release version');
            const tag = `v${version}`;
            const { owner, repo } = context.repo;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: `献立ノート ${tag}`, draft: false, prerelease: false,
                body: [
                  `## 献立ノート ${tag}`,
                  '',
                  '### このバージョンの変更',
                  ...(version === '1.3.11' ? [
                    '- 献立生成を分類・料理名・再抽選のみの1行表示に変更',
                    '- 主菜のみ7日分ならスマホ画面内に収まるコンパクト表示',
                    '- 料理名タップによる編集は維持、固定状態の旧下書きも再抽選可能に',
                    '- AIキー不要の補足表示を削除',
                  ] : version === '1.3.10' ? [
                    '- Google認証の準備完了後、ヘッダーの未接続を1回押すだけでログイン開始',
                    '- 設定変更後のスクロール位置を保持',
                    '- iPhoneでの日付入力欄のはみ出しを修正',
                    '- 通知と調理実績の凡例を全画面共通の固定ステータスバーに統合',
                  ] : version === '1.3.9' ? [
                    '- スマホで未接続の場合、ヘッダーを1タップしてGoogleへ再ログイン',
                    '- 接続済みの場合は従来どおり接続設定へ移動',
                    '- Googleトークンを永続保存せずに認証導線を短縮',
                  ] : version === '1.3.8' ? [
                    '- 新規の初期分類を主菜のみとし、その他の分類は追加・削除可能に',
                    '- 標準カレンダーを廃止して分類ごとの指定に統一',
                    '- 既存の標準カレンダーを主菜へ移行し、設定を保持',
                    '- スマホの履歴開始日による横はみ出しを修正',
                  ] : version === '1.3.7' ? [
                    '- 既存の献立予定を取り込み確認なしで確定履歴として表示',
                    '- 編集・削除は元のGoogleカレンダー予定へ即時反映',
                    '- 取得した予定と取り込み判定を端末に永続保存しない',
                    '- 既存端末キャッシュの読み込み時に履歴を破棄',
                  ] : version === '1.3.6' ? [
                    '- ページ再読み込み後に有効なGoogleカレンダー接続をタブ内で自動復元',
                    '- 保存先のカレンダー一覧と履歴を自動再取得',
                    '- 接続解除・期限切れ時には一時認証情報を消去',
                  ] : version === '1.3.5' ? [
                    '- ブラウザでのfetch呼び出し時のIllegal invocationエラーを修正',
                    '- カレンダーとGoogle Driveの双方に回帰テストを追加',
                  ] : version === '1.3.4' ? [
                    '- カレンダー通信失敗時にブラウザのネットワークエラー・タイムアウト・実行エラーを区別して表示',
                    '- ブラウザの診断箇所を案内し、入力済みの内容を保持',
                  ] : version === '1.3.3' ? [
                    '- Googleカレンダー一覧取得の失敗理由を設定画面に表示',
                    '- 一覧0件の案内と再取得ボタンを追加',
                    '- Calendar API未有効化エラーの識別を改善',
                  ] : version === '1.3.2' ? [
                    '- OAuthクライアントIDを利用者向け設定画面から撤去',
                    '- GitHub Actionsリポジトリ変数を公開ビルドに適用',
                    '- 一般利用者はGoogleアカウントでログインするだけ',
                  ] : version === '1.3.1' ? [
                    '- Google認証ライブラリの読み込み競合を防止',
                    '- 再ログイン時に選択済みカレンダーの履歴を自動再同期',
                    '- 初回OAuth設定が必要な場合の案内とAPIエラーを改善',
                  ] : version === '1.3.0' ? [
                    '- 料理以外のカレンダーを表示専用で追加できる機能',
                    '- 予定タイトルの文字列からアイコンを表示するルールを追加',
                    '- アイコンはアプリ内のみ変更しGoogleカレンダーを保護',
                  ] : version === '1.2.0' ? [
                    '- 主菜・副菜・汁物などを別々のGoogleカレンダーへ保存',
                    '- 同じカレンダーを複数の分類に指定可能',
                    '- 割り当てた各カレンダーから重複なく履歴を同期',
                    '- 分類別カレンダー設定をDriveバックアップに追加',
                  ] : version === '1.1.1' ? [
                    '- Google接続案内バナーを削除し、ヘッダーの未接続表示から接続設定へ移動',
                    '- カレンダーを毎月7列×6行（42マス）に統一',
                    '- 前後月の日付は文字のみ薄く表示し、マスの境界線を均一化',
                  ] : [
                    '- 変更内容はリポジトリのコミット履歴をご確認ください。',
                  ]),
                  '',
                  '自動テスト・ビルド・GitHub Pagesデプロイが成功したバージョンです。',
                  'Google実アカウント連携・スマートフォン実機の動作確認は別途必要です。',
                  '',
                  '添付のkondate-web.zipは静的Web公開用ファイルです。ソース一式はSource codeから取得できます。'
                ].join('\n')
              })).data;
            }
            if (!release.assets.some(asset => asset.name === 'kondate-web.zip')) {
              // An existing version is immutable: only recover an upload for this commit.
              const ref = (await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })).data;
              if (ref.object.sha === context.sha) {
                await github.rest.repos.uploadReleaseAsset({
                  owner, repo, release_id: release.id, name: 'kondate-web.zip',
                  data: fs.readFileSync('kondate-web.zip'),
                  headers: { 'content-type': 'application/zip' }
                });
              }
            }
            core.notice(`Release available: ${release.html_url}`);
