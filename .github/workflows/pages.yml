name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  release:
    name: Publish versioned release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build release archive
        run: |
          npm run build
          cd dist
          zip -r ../kondate-web.zip .
      - name: Create release when version is new
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid release version');
            const tag = `v${version}`;
            const { owner, repo } = context.repo;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: `献立ノート ${tag}`, draft: false, prerelease: false,
                body: [
                  '## 献立ノート 初回リリース',
                  '',
                  '- Googleカレンダー認証・同期、実績の登録・編集・削除',
                  '- 料理履歴・料理マスター、表記統一',
                  '- AIなしの献立生成、差し替え・固定・再抽選・下書き保存',
                  '- 4タブ、14テーマ、PWA対応',
                  '- AI選定・写真解析の拡張基盤（API接続は今後対応）',
                  '',
                  '自動テスト22件・ビルド・GitHub Pagesへのデプロイ成功後に発行しています。',
                  'Google実アカウント連携・スマートフォン実機の動作確認は未完了です。',
                  '導入とGoogle OAuth設定はREADME.md、確認範囲はVERIFICATION.mdを参照してください。',
                  '',
                  '添付のkondate-web.zipは静的Web公開用ファイルです。ソース一式はSource codeから取得できます。'
                ].join('\n')
              })).data;
            }
            if (!release.assets.some(asset => asset.name === 'kondate-web.zip')) {
              // An existing version is immutable: only recover an upload for this commit.
              const ref = (await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })).data;
              if (ref.object.sha === context.sha) {
                await github.rest.repos.uploadReleaseAsset({
                  owner, repo, release_id: release.id, name: 'kondate-web.zip',
                  data: fs.readFileSync('kondate-web.zip'),
                  headers: { 'content-type': 'application/zip' }
                });
              }
            }
            core.notice(`Release available: ${release.html_url}`);
