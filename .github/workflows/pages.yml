name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
env:
  GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  release:
    name: Publish versioned release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build release archive
        run: |
          npm run build
          cd dist
          zip -r ../kondate-web.zip .
      - name: Create release when version is new
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid release version');
            const tag = `v${version}`;
            const { owner, repo } = context.repo;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: `献立ノート ${tag}`, draft: false, prerelease: false,
                body: [
                  `## 献立ノート ${tag}`,
                  '',
                  '### このバージョンの変更',
                  ...(version === '1.3.28' ? [
                    '- カレンダーとステータスバーの間に1行の予定プリセット・アイコンバーを追加',
                    '- アイコン選択中は日付タップでGoogle予定を登録し、同一の予定はタップで削除',
                    '- プリセット別のタイトル・メモ・アイコン・登録先カレンダー設定に対応',
                    '- 同じタイトルでメモ違いのプリセットを独立して判定',
                    '- カレンダーにはアイコンとメモを並べ、省略記号を出さずクリッピング',
                    '- 既存のアイコンルールと設定のGoogle Drive同期を維持',
                  ] : version === '1.3.27' ? [
                    '- カレンダーの自動更新間隔を設定から選択（オフ／1／3／5／10／15／30／60分）',
                    '- 表示中の定期更新に加え、画面復帰・通信復帰時は古い予定を再取得',
                    '- Google認証切れ・通信断・編集中の多重同期を防止',
                    '- 自動更新間隔を端末保存・設定バックアップ・Drive同期に対応',
                  ] : version === '1.3.26' ? [
                    '- 場所サジェストを日本語地名に対応したPhoton公開APIの言語設定で修正',
                    '- 場所サジェスト・献立案廃止・月カレンダー拡大など前版の全変更を収録',
                    '- GitHub Pagesとダウンロード用ZIPの修正版を同一リリースとして提供',
                  ] : version === '1.3.25' ? [
                    '- 場所の入力欄にオンライン地名サジェスト（OpenStreetMap Photon）を追加',
                    '- APIキー・サーバー不要、通信エラー時も自由入力可能',
                    '- 献立案のカレンダー登録・状態選択を廃止し、過去の献立案は表示しない（Google上には保持）',
                    '- 月カレンダーから履歴一覧／月表示切替と料理マスターボタンを撤去',
                    '- 料理マスターは献立生成画面から操作できるよう移動',
                    '- カレンダー内の料理名から先頭の点を除去、省略記号を出さずクリッピング',
                    '- カレンダーの領域を拡大',
                  ] : version === '1.3.24' ? [
                    '- Googleカレンダーの場所が入力された予定は外食と判定し、調理履歴由来の献立候補から除外',
                    '- 場所のある外食実績は調理回数や最終調理日に含めず、予定の表示は維持',
                    '- 調理実績の登録・編集にGoogleカレンダー連携の「場所」入力欄を追加',
                    '- 既存の予定の場所を読み込み、カレンダーごとの登録・編集・場所の削除に対応',
                    '- 外食判定・Googleカレンダー保存・モバイル入力の回帰テストを追加',
                  ] : version === '1.3.23' ? [
                    '- 選択済みの日付は1回のタップで詳細・登録画面を開く',
                    '- 未選択の日付はタップで選択し、その後のタップで詳細を開く',
                    '- 初期状態で選択されている「今日」も1タップで詳細を開く',
                    '- 月送りの左右スワイプ動作は維持',
                  ] : version === '1.3.22' ? [
                    '- カレンダーの日付は1回目のタップで選択、同じ日付への2回目のタップで詳細・登録画面を開く',
                    '- 初期状態で選択されている今日も1回目のタップで詳細画面を開かないよう変更',
                    '- 月カレンダーの左右スワイプで前月・翌月へ移動',
                    '- 縦スクロール・短いタップの誤判定やスワイプ後のゴーストクリックを抑制',
                    '- 月移動の年境界やキーボード操作を回帰テストで確認',
                  ] : version === '1.3.21' ? [
                    '- 1端末でもDrive更新番号だけで誤って競合判定される問題を修正',
                    '- 保存された設定内容の比較で同一データの競合を自動解消',
                    '- 両端末の変更が実際に衝突した場合のみ自動上書きを停止',
                    '- Drive保存後の更新番号をAPI応答から正確に取得',
                    '- 同期中の編集を取りこぼさないように保護',
                  ] : version === '1.3.20' ? [
                    '- 実績登録のサジェスト選択を入力欄へ即時反映し、タップ中の再描画を排除',
                    '- iPhoneのフォーカス移動より前にタップを確定し、分類・料理属性を保持',
                    '- 候補選択をテストで検証',
                  ] : version === '1.3.19' ? [
                    '- 調理実績入力の料理名サジェストをiPhoneでも動作する独自の候補一覧に変更',
                    '- 料理名候補のタップ選択で分類・食材・調理属性を引き継ぐ',
                    '- 実績登録の日付入力がスマートフォン幅をはみ出す問題を修正',
                    '- 全画面のスマートフォン用入力欄の自動ズームを防止し、編集後のレイアウト崩れを抑制',
                    '- ピンチ操作による手動ズーム機能は維持',
                  ] : version === '1.3.18' ? [
                    '- カレンダーへ登録するタイトルを料理名だけに変更',
                    '- 分類別カレンダーへの振り分けとイベント属性は従来どおり',
                  ] : version === '1.3.17' ? [
                    '- 端末ごとの選択でGoogle Drive設定の双方向自動同期を追加',
                    '- 起動時・画面復帰・定期確認で別端末の設定を自動取得',
                    '- ローカルの設定変更後にDriveへ自動保存',
                    '- 未同期の変更が競合した場合は自動上書きを防止',
                    '- Drive認証が切れた場合は固定ステータスバーから再接続',
                  ] : version === '1.3.16' ? [
                    '- 別端末への設定引き継ぎ用Googleドライブバックアップを独立した設定カードに整理',
                    '- 料理マスター手動登録・分類・生成ルール・下書きなどをまとめてバックアップ',
                    '- 既存のバックアップを上書きする前に確認',
                    '- 復元前に保存日時と内容を確認し、Googleログインを維持したまま同期',
                    '- Googleカレンダー実績・認証情報をDriveへ送信しない',
                  ] : version === '1.3.15' ? [
                    '- オプションでGoogle接続情報を有効期限まで端末に保持',
                    '- 起動時に有効期限内なら認証画面なしで自動接続',
                    '- 再認証が必要なら全画面共通のステータスバーを目立つ警告に切り替え',
                    '- 警告をタップするとGoogleへの再接続を開始',
                  ] : version === '1.3.14' ? [
                    '- 実績登録のカメラ起動ボタンを廃止し写真選択に統一',
                    '- 実績入力の途中再開・破棄確認ダイアログを削除',
                    '- 未確定の実績入力は端末に保存せず、閉じたら破棄',
                    '- 献立生成の下書きとカレンダーへの即時保存は維持',
                  ] : version === '1.3.13' ? [
                    '- 2品×7日がスマホ1画面に収まりやすいよう料理行と日別カードの余白を圧縮',
                    '- 日数表示を各日の料理行群に対して上下中央配置',
                    '- 再抽選ボタンを小型化し、分類・料理名の表示幅を確保',
                    '- 3品以上の日は必要な分だけ縦へ伸ばし一覧をスクロール',
                  ] : version === '1.3.12' ? [
                    '- 複数品で崩れる献立生成レイアウトを日別の縦積み構成に修正',
                    '- 各日の高さを料理数に合わせて自然に拡張し、必要に応じてスクロール',
                    '- 小型スマホと長い料理名の横はみ出しを防止',
                    '- 主菜1品×7日のコンパクト表示を維持',
                  ] : version === '1.3.11' ? [
                    '- 献立生成を分類・料理名・再抽選のみの1行表示に変更',
                    '- 主菜のみ7日分ならスマホ画面内に収まるコンパクト表示',
                    '- 料理名タップによる編集は維持、固定状態の旧下書きも再抽選可能に',
                    '- AIキー不要の補足表示を削除',
                  ] : version === '1.3.10' ? [
                    '- Google認証の準備完了後、ヘッダーの未接続を1回押すだけでログイン開始',
                    '- 設定変更後のスクロール位置を保持',
                    '- iPhoneでの日付入力欄のはみ出しを修正',
                    '- 通知と調理実績の凡例を全画面共通の固定ステータスバーに統合',
                  ] : version === '1.3.9' ? [
                    '- スマホで未接続の場合、ヘッダーを1タップしてGoogleへ再ログイン',
                    '- 接続済みの場合は従来どおり接続設定へ移動',
                    '- Googleトークンを永続保存せずに認証導線を短縮',
                  ] : version === '1.3.8' ? [
                    '- 新規の初期分類を主菜のみとし、その他の分類は追加・削除可能に',
                    '- 標準カレンダーを廃止して分類ごとの指定に統一',
                    '- 既存の標準カレンダーを主菜へ移行し、設定を保持',
                    '- スマホの履歴開始日による横はみ出しを修正',
                  ] : version === '1.3.7' ? [
                    '- 既存の献立予定を取り込み確認なしで確定履歴として表示',
                    '- 編集・削除は元のGoogleカレンダー予定へ即時反映',
                    '- 取得した予定と取り込み判定を端末に永続保存しない',
                    '- 既存端末キャッシュの読み込み時に履歴を破棄',
                  ] : version === '1.3.6' ? [
                    '- ページ再読み込み後に有効なGoogleカレンダー接続をタブ内で自動復元',
                    '- 保存先のカレンダー一覧と履歴を自動再取得',
                    '- 接続解除・期限切れ時には一時認証情報を消去',
                  ] : version === '1.3.5' ? [
                    '- ブラウザでのfetch呼び出し時のIllegal invocationエラーを修正',
                    '- カレンダーとGoogle Driveの双方に回帰テストを追加',
                  ] : version === '1.3.4' ? [
                    '- カレンダー通信失敗時にブラウザのネットワークエラー・タイムアウト・実行エラーを区別して表示',
                    '- ブラウザの診断箇所を案内し、入力済みの内容を保持',
                  ] : version === '1.3.3' ? [
                    '- Googleカレンダー一覧取得の失敗理由を設定画面に表示',
                    '- 一覧0件の案内と再取得ボタンを追加',
                    '- Calendar API未有効化エラーの識別を改善',
                  ] : version === '1.3.2' ? [
                    '- OAuthクライアントIDを利用者向け設定画面から撤去',
                    '- GitHub Actionsリポジトリ変数を公開ビルドに適用',
                    '- 一般利用者はGoogleアカウントでログインするだけ',
                  ] : version === '1.3.1' ? [
                    '- Google認証ライブラリの読み込み競合を防止',
                    '- 再ログイン時に選択済みカレンダーの履歴を自動再同期',
                    '- 初回OAuth設定が必要な場合の案内とAPIエラーを改善',
                  ] : version === '1.3.0' ? [
                    '- 料理以外のカレンダーを表示専用で追加できる機能',
                    '- 予定タイトルの文字列からアイコンを表示するルールを追加',
                    '- アイコンはアプリ内のみ変更しGoogleカレンダーを保護',
                  ] : version === '1.2.0' ? [
                    '- 主菜・副菜・汁物などを別々のGoogleカレンダーへ保存',
                    '- 同じカレンダーを複数の分類に指定可能',
                    '- 割り当てた各カレンダーから重複なく履歴を同期',
                    '- 分類別カレンダー設定をDriveバックアップに追加',
                  ] : version === '1.1.1' ? [
                    '- Google接続案内バナーを削除し、ヘッダーの未接続表示から接続設定へ移動',
                    '- カレンダーを毎月7列×6行（42マス）に統一',
                    '- 前後月の日付は文字のみ薄く表示し、マスの境界線を均一化',
                  ] : [
                    '- 変更内容はリポジトリのコミット履歴をご確認ください。',
                  ]),
                  '',
                  '自動テスト・ビルド・GitHub Pagesデプロイが成功したバージョンです。',
                  'Google実アカウント連携・スマートフォン実機の動作確認は別途必要です。',
                  '',
                  '添付のkondate-web.zipは静的Web公開用ファイルです。ソース一式はSource codeから取得できます。'
                ].join('\n')
              })).data;
            }
            if (!release.assets.some(asset => asset.name === 'kondate-web.zip')) {
              // An existing version is immutable: only recover an upload for this commit.
              const ref = (await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })).data;
              if (ref.object.sha === context.sha) {
                await github.rest.repos.uploadReleaseAsset({
                  owner, repo, release_id: release.id, name: 'kondate-web.zip',
                  data: fs.readFileSync('kondate-web.zip'),
                  headers: { 'content-type': 'application/zip' }
                });
              }
            }
            core.notice(`Release available: ${release.html_url}`);
