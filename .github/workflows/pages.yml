name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
env:
  GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
  KONDATE_AI_FIREBASE_CONFIG: ${{ vars.KONDATE_AI_FIREBASE_CONFIG }}
  KONDATE_AI_APP_CHECK_SITE_KEY: ${{ vars.KONDATE_AI_APP_CHECK_SITE_KEY }}
  KONDATE_AI_SPARK_VERIFIED: ${{ vars.KONDATE_AI_SPARK_VERIFIED }}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate centered icons without changing original colors
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/center_icons_without_recolor.py
          if ! git diff --quiet -- icons/icon-512.png icons/icon-192.png icons/apple-touch-icon.png; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add icons/icon-512.png icons/icon-192.png icons/apple-touch-icon.png
            git commit -m "fix: preserve original KonDate icon colors"
            git push origin HEAD:main
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  release:
    name: Publish versioned release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build release archive
        run: |
          npm run build
          cd dist
          zip -r ../kondate-web.zip .
      - name: Create or update release notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid release version');
            const tag = `v${version}`;
            const { owner, repo } = context.repo;
            const autoNotesMarker='__AUTO_GENERATED_CHANGELOG__';
            let body=[
                  `## KonDate ${tag}`,
                  '',
                  '### このバージョンの変更',
                  ...(version === '1.14.23' ? [
                    '- 料理マスター・買い物共有と設定バックアップのGoogle Drive認証を一元化',
                    '- 統合認証が未接続または期限切れの場合、両タブの共有ボタンを無効化',
                    '- 共有画面の再認証・アカウント変更ボタンを削除し設定画面のDrive接続に集約',
                    '- 過去の権限不足トークンは再認証を要求し、既存の共有ファイルと未送信データは維持',
                    '- 統合トークン・認証切れ・共有UIの回帰テストを追加',
                  ] : version === '1.14.22' ? [
                    '- 共有ファイルURL欄を編集すると接続先との一致に応じて「コピー」「参加」が切り替わる',
                    '- 別の共有URLへ参加すると明示的に「共有された側」として接続',
                    '- 共有相手のメールアドレス欄の右に「追加／共有」ボタンを配置',
                    '- ダイアログ下部の「共有URLに参加」「相手を追加」を削除して操作を整理',
                    '- iPhoneの画面幅でも入力欄と操作ボタンを同じ行に表示',
                    '- 共有URL切り替えとボタン配置の回帰テストを追加',
                  ] : version === '1.14.21' ? [
                    '- 自分の共有ファイルが見つかった場合は選択不要で自動的に共有した側として接続',
                    '- 共有された側で参加している場合は自分のファイル検索を無視して参加先を維持',
                    '- 共有ファイルのURLを役割に関係なく入力欄へ表示し、横にコピーボタンを配置',
