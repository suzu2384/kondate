              const ref = (await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })).data;
              if (ref.object.sha === (await github.rest.repos.getBranch({ owner, repo, branch: 'main' })).data.commit.sha) {
                await github.rest.repos.uploadReleaseAsset({
                  owner, repo, release_id: release.id, name: 'kondate-web.zip',
                  data: fs.readFileSync('kondate-web.zip'),
                  headers: { 'content-type': 'application/zip' }
                });
              }
            }
            core.notice(`Release available: ${release.html_url}`);
            // The AI prompt adjustment corrected existing behavior; it was not a
            // new feature. Remove only the erroneously numbered release and tag,
            // after the corrected v1.13.2 release was successfully published.
            if (version === '1.13.2') {
              const obsoleteTag='v1.14.0';
              try {
                const obsolete=(await github.rest.repos.getReleaseByTag({
                  owner,repo,tag:obsoleteTag
                })).data;
                if (!obsolete.body?.includes('AIの献立生成で古い調理履歴ばかりを優先する偏りを緩和')) {
                  throw new Error('Unexpected v1.14.0 contents: refusing to delete release.');
                }
                await github.rest.repos.deleteRelease({owner,repo,release_id:obsolete.id});
                core.notice('Removed incorrectly numbered v1.14.0 release.');
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              try {
                await github.rest.git.deleteRef({owner,repo,ref:'tags/v1.14.0'});
                core.notice('Removed incorrectly numbered v1.14.0 tag.');
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            // Correct the mistaken major-version release only AFTER v1.10.0 is available.
            if (version === '1.10.0') {
              try {
                const mistaken=(await github.rest.repos.getReleaseByTag({owner,repo,tag:'v2.0.0'})).data;
                // Do not delete another release unless it is exactly this mistaken shopping version.
                if (!mistaken.body?.includes('下部の記録タブを買い物タブに置き換え')) {
                  throw new Error('Unexpected v2.0.0 content; refusing to delete the release.');
                }
                await github.rest.repos.deleteRelease({owner,repo,release_id:mistaken.id});
                core.notice('Removed mistakenly numbered v2.0.0 release.');
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              try {
                await github.rest.git.deleteRef({owner,repo,ref:'tags/v2.0.0'});
                core.notice('Removed mistakenly numbered v2.0.0 tag.');
              } catch (error) {
                if (error.status !== 404) throw error;
              }
