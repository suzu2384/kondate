name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
env:
  GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  release:
    name: Publish versioned release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build release archive
        run: |
          npm run build
          cd dist
          zip -r ../kondate-web.zip .
      - name: Create release when version is new
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid release version');
            const tag = `v${version}`;
            const { owner, repo } = context.repo;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: `献立ノート ${tag}`, draft: false, prerelease: false,
                body: [
                  `## 献立ノート ${tag}`,
                  '',
                  '### このバージョンの変更',
                  ...(version === '1.3.49' ? [
                    '- 出典表示を調理実績の入力フォーム下部から削除',
                    '- デスクトップでは検索候補の下部、スマホでは検索画面の下部にのみ表示',
                    '- OpenStreetMapとPhotonへの出典リンクを維持',
                    '- 店舗の検索・選択・保存処理はそのまま維持',
                  ] : version === '1.3.48' ? [
                    '- 場所入力欄の長い説明文と店舗検索の注意書きを削除',
                    '- OpenStreetMapとPhotonの出典表示のみを1行で維持',
                    '- 場所の検索処理・UI操作・保存方法は変更なし',
                  ] : version === '1.3.46' ? [
                    '- スマホで場所入力中の検索欄を可視領域の上部に固定し候補を下へ表示',
                    '- キーボードで表示領域が縮んでも検索欄が候補に隠れないよう調整',
                    '- 候補一覧だけをスクロールしてタップで選択できる専用検索パネル',
                    '- 選んだ店舗情報は既存の場所欄とGoogleカレンダー保存処理へ反映',
                    '- 検索専用パネルを閉じても入力した場所を保持し自由入力にも対応',
                  ] : version === '1.3.45' ? [
                    '- 1つの場所検索欄で店舗名・支店名・住所の断片を順不同AND検索',
                    '- 入力が増えたら保持している候補を即座に絞り込む',
                    '- Photonの全体検索に加え住所フラグメントを地理的な基点として候補を追加取得',
                    '- 店舗名と地名の順番を逆にしても同じ条件で検索',
                    '- 既存の浮動サジェスト表示・スクロール・自由入力保存を維持',
                    '- 候補の上限とAPI検索データの制約は変わらない',
                  ] : version === '1.3.44' ? [
                    '- 場所サジェストを検索窓直下に浮かべる表示へ変更しフォームの高さを変えない',
                    '- ダイアログ内部のスクロール領域の外で候補を表示してクリッピングを防止',
